[package]
name = "slatedb-probe"
default-run = "slatedb-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
slatedb = { version = "=0.16.0", default-features = false, features = ["aws"] }
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.0", features = ["v4"] }
