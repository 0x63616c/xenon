<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Xenon request path</title><desc id="desc">SDKs, Omes and UI use Temporal instances. Persistence adapters connect through one Xenon service to Go nodes and partition owners. SlateDB persists data to S3 alongside conditional ownership metadata.</desc><rect width="1200" height="760" fill="#f5f7fb"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="65" y="75" font-size="34" font-weight="600" fill="#1d1d1f">Xenon. From workflow to object storage.</text><text x="65" y="108" font-size="16" fill="#677182">Conceptual architecture · Experimental implementation · No performance claim</text><g stroke="#c1d2e7" stroke-width="2" fill="none"><path d="M230 218v20h740v-20M600 218v48M600 342v40M600 437v24H225v24M600 461H975v24M600 461v24M225 548v45m375-45v45m375-45v45M225 663v25h750v-25M600 688v20"/></g><g fill="white" stroke="#dce4ee"><rect x="70" y="155" width="320" height="63" rx="14"/><rect x="440" y="155" width="320" height="63" rx="14"/><rect x="810" y="155" width="320" height="63" rx="14"/><rect x="145" y="266" width="910" height="76" rx="15"/></g><g text-anchor="middle" fill="#293445" font-size="19" font-weight="600"><text x="230" y="194">Existing SDKs</text><text x="600" y="194">Omes workloads</text><text x="970" y="194">Temporal UI</text><text x="600" y="297">Temporal instances + persistence adapters</text></g><g text-anchor="middle" fill="#737f90" font-size="14"><text x="600" y="320">Frontend · History · Matching · Worker → Complete typed persistence operations</text></g><rect x="275" y="382" width="650" height="55" rx="15" fill="#1b2432"/><text x="600" y="416" text-anchor="middle" font-size="19" font-weight="600" fill="white">One Xenon service endpoint</text><g fill="white" stroke="#cbdbee"><rect x="75" y="485" width="300" height="63" rx="14"/><rect x="450" y="485" width="300" height="63" rx="14"/><rect x="825" y="485" width="300" height="63" rx="14"/></g><g font-size="17" font-weight="600" fill="#263c57" text-anchor="middle"><text x="225" y="513">Go node A</text><text x="600" y="513">Go node B</text><text x="975" y="513">Go node C</text></g><g font-size="13" fill="#708096" text-anchor="middle"><text x="225" y="535">Execute locally or forward</text><text x="600" y="535">Execute locally or forward</text><text x="975" y="535">Execute locally or forward</text></g><g fill="#e6effa" stroke="#c6d8ed"><rect x="75" y="593" width="300" height="70" rx="14"/><rect x="450" y="593" width="300" height="70" rx="14"/><rect x="825" y="593" width="300" height="70" rx="14"/></g><g font-size="17" font-weight="600" fill="#255180" text-anchor="middle"><text x="225" y="622">Partition gate + SlateDB</text><text x="600" y="622">Partition gate + SlateDB</text><text x="975" y="622">Partition gate + SlateDB</text></g><g font-size="13" fill="#647d9b" text-anchor="middle"><text x="225" y="644">Atomic state + durable outcome</text><text x="600" y="644">Fresh authority + durable barrier</text><text x="975" y="644">One writer per partition</text></g><text x="600" y="735" text-anchor="middle" font-size="20" font-weight="600" fill="#273950">S3 · Application data + conditional topology / ownership metadata</text></g></svg>
