<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Xenon unified-agent architecture</title>
  <desc id="desc">Temporal clients use one endpoint backed by identical Xenon agents. Agents execute owned partitions or forward internally, while S3 stores durable application data and cluster metadata.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#eef4fc"/></linearGradient>
    <linearGradient id="dark"><stop stop-color="#111827"/><stop offset="1" stop-color="#26364d"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#91acd0"/></marker>
    <style>.h{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.sub{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.t{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.b{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.white{fill:#fff}.muted{fill:#cbd5e1}.tag{font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#3979d3;letter-spacing:1px}.line{fill:none;stroke:#91acd0;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="70" y="65" class="h">One Temporal endpoint. Identical Xenon agents.</text>
  <text x="70" y="94" class="sub">Add agents for capacity; keep durable state and cluster authority in S3.</text>
  <rect x="70" y="135" width="1060" height="82" rx="18" fill="#fff" stroke="#cfdbeb"/>
  <text x="100" y="169" class="tag">YOUR APPLICATIONS</text><text x="100" y="196" class="t">Existing Temporal SDKs · workers · UI · Omes</text><text x="1088" y="183" text-anchor="end" class="b">Temporal-compatible API</text>
  <path d="M600 217V262" class="line"/>
  <rect x="375" y="263" width="450" height="82" rx="18" fill="url(#dark)"/>
  <text x="600" y="296" text-anchor="middle" class="t white">One Xenon service endpoint</text><text x="600" y="321" text-anchor="middle" class="b muted">Load balancer or Kubernetes Service</text>
  <path d="M600 345V383M220 383H980M220 383V420M600 383V420M980 383V420" fill="none" stroke="#91acd0" stroke-width="2"/>
  <g>
    <rect x="70" y="420" width="300" height="150" rx="18" fill="#fff" stroke="#c9d8eb"/><text x="95" y="452" class="tag">AGENT A</text><text x="95" y="484" class="t">Temporal + Xenon runtime</text><text x="95" y="510" class="b">Execute owned partitions</text><text x="95" y="533" class="b">Forward all others</text>
    <rect x="95" y="545" width="66" height="7" rx="3" fill="#51bca7"/><rect x="168" y="545" width="66" height="7" rx="3" fill="#6fa9ed"/><rect x="241" y="545" width="66" height="7" rx="3" fill="#dce5f1"/>
    <rect x="450" y="420" width="300" height="150" rx="18" fill="#fff" stroke="#c9d8eb"/><text x="475" y="452" class="tag">AGENT B</text><text x="475" y="484" class="t">Temporal + Xenon runtime</text><text x="475" y="510" class="b">Execute owned partitions</text><text x="475" y="533" class="b">Forward all others</text>
    <rect x="475" y="545" width="66" height="7" rx="3" fill="#dce5f1"/><rect x="548" y="545" width="66" height="7" rx="3" fill="#51bca7"/><rect x="621" y="545" width="66" height="7" rx="3" fill="#6fa9ed"/>
    <rect x="830" y="420" width="300" height="150" rx="18" fill="#fff" stroke="#c9d8eb"/><text x="855" y="452" class="tag">AGENT C</text><text x="855" y="484" class="t">Temporal + Xenon runtime</text><text x="855" y="510" class="b">Execute owned partitions</text><text x="855" y="533" class="b">Forward all others</text>
    <rect x="855" y="545" width="66" height="7" rx="3" fill="#6fa9ed"/><rect x="928" y="545" width="66" height="7" rx="3" fill="#dce5f1"/><rect x="1001" y="545" width="66" height="7" rx="3" fill="#51bca7"/>
  </g>
  <path d="M220 570V620M600 570V620M980 570V620" class="line"/>
  <rect x="70" y="622" width="1060" height="88" rx="18" fill="#e8f1fd" stroke="#bdd1ec"/>
  <text x="100" y="656" class="tag">S3 — DURABLE AUTHORITY</text><text x="100" y="685" class="t">Application state</text><text x="310" y="685" class="t">Ownership directory</text><text x="575" y="685" class="t">Topology + heartbeats</text><text x="1098" y="672" text-anchor="end" class="b">Local disks are disposable</text>
  <text x="600" y="742" text-anchor="middle" class="sub">SlateDB is the current internal storage engine. Customers operate Xenon agents and S3.</text>
</svg>
