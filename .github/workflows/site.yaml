name: Xenon site
on:
  push:
    branches: [main]
    paths: ['docs/guide/**', 'website/**', '.github/workflows/site.yaml']
  pull_request:
    paths: ['docs/guide/**', 'website/**', '.github/workflows/site.yaml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy generated site assets'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: xenon-site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run build --prefix website
        env:
          SITE_BASE: /xenon/
      - name: Browser checks at desktop, tablet and mobile sizes
        working-directory: website
        run: |
          npx playwright install --with-deps chromium
          mkdir -p ../.local
          SITE_BASE=/xenon/ npm run preview > ../.local/site-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://localhost:4178/xenon/ > /dev/null && break; sleep 1; done
          npm run test:ui -- http://localhost:4178/xenon/ ../.local/site-qa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: site-browser-qa
          path: .local/site-qa
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        with:
          path: website/dist
  deploy:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only the curated static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
