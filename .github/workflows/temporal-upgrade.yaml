name: temporal-existing-state-upgrade
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade-v1-31-1-to-v1-31-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - name: Run pinned existing-state workflow upgrade
        run: |
          set -o pipefail
          mkdir -p .local/evidence/temporal-upgrade-v1.31.1-v1.31.2
          bash scripts/ci-temporal-upgrade.sh 2>&1 | tee .local/evidence/temporal-upgrade-v1.31.1-v1.31.2/build-and-run.log
      - name: Retain upgrade impact and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporal-upgrade-v1.31.1-v1.31.2
          path: .local/evidence/temporal-upgrade-v1.31.1-v1.31.2/
          include-hidden-files: true
          if-no-files-found: error
