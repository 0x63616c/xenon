name: persistence-gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
          components: clippy,rustfmt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - run: python3 scripts/install-protoc.py >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: python3 -m unittest discover -s scripts -p 'test_prove.py'
      - run: python3 scripts/prove.py primitive
      - run: python3 scripts/prove.py ownership
      - run: cargo run --locked -p slatedb-probe
      - run: python3 scripts/prove.py shard
      - run: go test -race ./...
      - run: go vet ./...
