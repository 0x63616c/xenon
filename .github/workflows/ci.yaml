name: persistence-gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
          components: clippy,rustfmt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - run: python3 scripts/install-protoc.py >> "$GITHUB_PATH"
      - name: Verify generated protobuf bindings match pinned sources
        run: |
          scripts/generate-proto.sh
          git diff --exit-code -- gen/
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/prove.py primitive
      - run: python3 scripts/prove.py ownership
      - run: cargo run --locked -p slatedb-probe
      - run: python3 scripts/prove.py shard
      - run: python3 scripts/prove.py go-nexus
      - run: python3 scripts/prove.py go-cluster
      - run: python3 scripts/prove.py go-queue
      - run: go test -race ./...
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: -L${{ github.workspace }}/.local/slatedb-native-target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/.local/slatedb-native-target/debug
          XENON_NODE_BINARY: ${{ github.workspace }}/.local/bin/xenon-go-node
          SLATEDB_UNIFFI_RUNTIME_THREADS: '2'
      - run: go vet ./...
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: -L${{ github.workspace }}/.local/slatedb-native-target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/.local/slatedb-native-target/debug
      - name: Retain partition proof provenance and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: partition-proof-evidence
          path: .local/evidence/
          if-no-files-found: warn
          include-hidden-files: true

  s3-crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
      - name: Verify hosted-runner dependencies
        run: |
          python3 --version
          aws --version
          docker version
          docker compose version
      - name: Run declared emulator crash and cleanup proof
        run: python3 scripts/prove.py crash
      - name: Retain exact proof provenance and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s3-emulator-crash-evidence
          path: .local/evidence/
          if-no-files-found: error
          include-hidden-files: true

  go-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - run: python3 scripts/prove.py go-bindings
      - name: Retain Go binding proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-bindings-evidence
          path: .local/evidence/
          if-no-files-found: error
          include-hidden-files: true
