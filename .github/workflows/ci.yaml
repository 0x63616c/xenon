name: persistence-gates
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: persistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unified-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify agent proof dependencies
        run: |
          aws --version
          docker version
          docker compose version
      - name: Run declared three-agent movement, eviction, and cold-recovery proof
        run: |
          docker compose -f test/scenarios/agent/compose.json pull
          python3 scripts/agent-smoke.py
      - name: Retain unified-agent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-agent-evidence
          path: .local/evidence/
          include-hidden-files: true
          if-no-files-found: error

  unified-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and inspect the declared unified image
        run: |
          set -o pipefail
          mkdir -p .local/evidence/container
          git rev-parse HEAD > .local/evidence/container/source-revision.txt
          sha256sum Dockerfile.unified-agent .dockerignore deploy/agent.example.json tools/slatedb-native.json > .local/evidence/container/input-sha256.txt
          docker build --progress=plain --build-arg XENON_SOURCE_REVISION="$(cat .local/evidence/container/source-revision.txt)" --iidfile .local/evidence/container/image-id.txt -f Dockerfile.unified-agent -t xenon-unified-agent:ci . 2>&1 | tee .local/evidence/container/build.log
          docker run --rm xenon-unified-agent:ci version | tee .local/evidence/container/version.json
          python3 -m json.tool .local/evidence/container/version.json > /dev/null
          test "$(python3 -c 'import json; print(json.load(open(".local/evidence/container/version.json"))["revision"])')" = "$(cat .local/evidence/container/source-revision.txt)"
          docker run --rm xenon-unified-agent:ci check-config --config /etc/xenon/agent.example.json | tee .local/evidence/container/check-config.log
          docker image inspect xenon-unified-agent:ci > .local/evidence/container/image-inspect.json
          test "$(docker image inspect xenon-unified-agent:ci --format '{{.Config.User}}')" = 65532:65532
          test "$(cat .local/evidence/container/check-config.log)" = XENON_CONFIG_VALID
      - name: Retain unified-container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-container-evidence
          path: .local/evidence/container/
          include-hidden-files: true
          if-no-files-found: error

  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
          components: clippy,rustfmt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - run: python3 scripts/install-protoc.py >> "$GITHUB_PATH"
      - name: Verify generated protobuf bindings match pinned sources
        run: |
          scripts/generate-proto.sh
          git diff --exit-code -- gen/
      - run: cargo fmt --manifest-path test/compatibility/rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path test/compatibility/rust/Cargo.toml --target-dir target --locked --workspace --all-targets -- -D warnings
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/prove.py runtime-measurements
      - run: python3 -O scripts/omes-corpus.py verify
      - run: python3 scripts/validate_acceptance.py
      - run: python3 scripts/prove.py primitive
      - run: python3 scripts/prove.py ownership
      - run: python3 scripts/prove.py simulation
      - run: cargo run --manifest-path test/compatibility/rust/Cargo.toml --target-dir target --locked -p slatedb-probe
      - run: python3 scripts/prove.py shard
      - run: python3 scripts/prove.py go-runtime-stores
      - run: python3 scripts/prove.py go-history-routing
      - run: python3 scripts/prove.py go-outcomes
      - run: python3 scripts/prove.py go-visibility
      - run: python3 scripts/prove.py rpc-measurement
      - run: python3 scripts/prove.py external-recorder
      - run: python3 scripts/prove.py go-visibility-frozen
      - run: go test -race ./...
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: -L${{ github.workspace }}/.local/slatedb-native-target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/.local/slatedb-native-target/debug
          XENON_NODE_BINARY: ${{ github.workspace }}/.local/bin/xenon-go-node
          SLATEDB_UNIFFI_RUNTIME_THREADS: '2'
      - run: go vet ./...
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: -L${{ github.workspace }}/.local/slatedb-native-target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/.local/slatedb-native-target/debug
      - name: Retain partition proof provenance and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: partition-proof-evidence
          path: .local/evidence/
          if-no-files-found: warn
          include-hidden-files: true

  s3-crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
      - name: Verify hosted-runner dependencies
        run: |
          python3 --version
          aws --version
          docker version
          docker compose version
      - name: Run declared emulator crash and cleanup proof
        run: python3 scripts/prove.py crash
      - name: Retain exact proof provenance and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s3-emulator-crash-evidence
          path: .local/evidence/
          if-no-files-found: error
          include-hidden-files: true

  go-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - run: python3 scripts/prove.py go-bindings
      - name: Retain Go binding proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-bindings-evidence
          path: .local/evidence/
          if-no-files-found: error
          include-hidden-files: true

  go-shard-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
          components: clippy,rustfmt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify hosted-runner emulator and native build dependencies
        run: |
          python3 --version
          cc --version
          aws --version
          docker version
          docker compose version
      - name: Run declared Rust and Go stored compatibility proof
        # The runner installs and hashes the pinned protoc before both node builds.
        run: python3 scripts/prove.py go-shard-compat
      - name: Retain exact compatibility provenance and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-shard-compat-evidence
          path: .local/evidence/
          if-no-files-found: error
          include-hidden-files: true

  s3-directory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
          components: clippy,rustfmt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify emulator dependencies
        run: |
          docker version
          docker compose version
      - run: python3 scripts/prove.py directory
      - name: Retain conditional directory proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s3-directory-evidence
          path: .local/evidence/
          include-hidden-files: true
          if-no-files-found: error

  s3-owner-manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
          components: clippy,rustfmt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify emulator dependencies
        run: |
          docker version
          docker compose version
      - run: python3 scripts/prove.py owner-manager
      - name: Retain owner manager proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s3-owner-manager-evidence
          path: .local/evidence/
          include-hidden-files: true
          if-no-files-found: error

  s3-maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
          components: clippy,rustfmt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify emulator dependencies
        run: |
          docker version
          docker compose version
      - run: python3 scripts/prove.py maintenance
      - name: Retain native maintenance proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s3-maintenance-evidence
          path: .local/evidence/
          include-hidden-files: true
          if-no-files-found: error

  s3-meter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - run: python3 scripts/prove.py s3-meter
      - name: Retain local HTTP meter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s3-meter-evidence
          path: .local/evidence/
          include-hidden-files: true
          if-no-files-found: error

  process-cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - run: python3 scripts/prove.py process-cut
      - name: Retain process-cut evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: process-cut-evidence
          path: .local/evidence/
          include-hidden-files: true
          if-no-files-found: error
