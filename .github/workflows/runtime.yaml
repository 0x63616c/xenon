name: Temporal runtime gates
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Committed runtime scenario (each result is its own gate)'
        type: choice
        default: smoke
        options: [smoke, omes-mixed, corrected-fuzz-soak, fuzz-soak, visibility-movement, delayed-owner, lost-directory-cas, after_await]
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
concurrency:
  group: xenon-runtime-${{ github.ref }}-${{ inputs.scenario || 'weekly' }}
  cancel-in-progress: false
jobs:
  runtime:
    name: runtime / ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario: ${{ github.event_name == 'schedule' && fromJSON('["smoke","omes-mixed","corrected-fuzz-soak"]') || fromJSON(format('["{0}"]', inputs.scenario)) }}
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
      GOTOOLCHAIN: go1.27.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.94.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install declared AWS CLI and Linux browser dependencies
        timeout-minutes: 15
        run: |
          mkdir -p .local/ci .local/aws-cli-download
          exec > >(tee .local/ci/setup.log) 2>&1
          curl --fail --location --silent --show-error https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.36.39.zip -o .local/aws-cli-download/aws.zip
          echo '2b337174417c159f8fd825637841f5425308108bd6f99681664409fb0d7ebe01  .local/aws-cli-download/aws.zip' | sha256sum --check
          unzip -q .local/aws-cli-download/aws.zip -d .local/aws-cli-download
          .local/aws-cli-download/aws/install --install-dir "$PWD/.local/aws-cli" --bin-dir "$PWD/.local/aws-bin"
          echo "$PWD/.local/aws-bin" >> "$GITHUB_PATH"
          npm ci --prefix website
          cd website
          npx playwright install-deps chromium
      - name: Verify environment and prepare pinned protobuf compiler
        timeout-minutes: 5
        run: |
          exec > >(tee .local/ci/preflight.log) 2>&1
          python3 scripts/install-protoc.py >> "$GITHUB_PATH"
          go version
          rustc -vV
          aws --version
          docker version
          docker compose version
          cc --version
          df -h .
      - name: Run committed Temporal scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -o pipefail
          # Reserve thirty minutes for setup, retained evidence and scoped cleanup.
          # A hosted-runner cutoff is a failed proof, never a shorter passing soak.
          case "$SCENARIO" in
            after_await) args=(--process-cut-stage after_await) ;;
            smoke|omes-mixed|corrected-fuzz-soak|fuzz-soak|visibility-movement|delayed-owner|lost-directory-cas) args=("--$SCENARIO") ;;
            *) exit 2 ;;
          esac
          timeout --signal=TERM --kill-after=60s 19800s python3 scripts/ministack-runtime.py "${args[@]}" 2>&1 | tee .local/ci/runtime.log
      - name: Retain receipts, logs and screenshots even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporal-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: |
            .local/evidence/
            .local/ci/
          include-hidden-files: true
          if-no-files-found: error
