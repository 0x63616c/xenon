syntax = "proto3";
package xenon.v1;
option go_package = "github.com/0x63616c/xenon/api/xenon/v1;xenonv1";

// Values retain their original scalar type and full int64 precision.
message QueryValue {
  oneof scalar {
    string string_value = 1;
    sint64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
  }
}
message QueryColumn {
  string field = 1;
  string alias = 2;
  // Temporal IndexedValueType numeric value at the pinned protocol version.
  int32 value_type = 3;
}
message QueryExpr {
  // Pinned converter operators, including and/or/not and typed comparisons.
  string operator = 1;
  QueryColumn column = 2;
  repeated QueryValue values = 3;
  repeated QueryExpr children = 4;
}
message VisibilityQuery {
  uint32 format_version = 1;
  string namespace_id = 2;
  QueryExpr predicate = 3;
  repeated QueryColumn group_by = 4;
  uint64 schema_version = 5;
  uint32 partition_format = 6;
  bytes schema_context_sha256 = 7;
}
