syntax = "proto3";
package xenon.v1;
option go_package = "github.com/0x63616c/xenon/api/xenon/v1;xenonv1";

// Complete operations on the control partition. No remote transactions.
service ClusterPersistence { rpc Execute(ClusterRequest) returns (ClusterResult); }
message ClusterRequest {
  uint32 protocol_version = 1;
  string partition = 2;
  string operation_id = 3;
  bytes command_sha256 = 4;
  ClusterCommand command = 5;
}
// UTC instant; preserves nanoseconds and Go's year-1 zero instant.
message ClusterTime { int64 seconds = 1; int32 nanos = 2; }
message ClusterBlob { bytes data = 1; int32 encoding = 2; }
message ClusterRecord { ClusterBlob blob = 1; int64 version = 2; }
message ClusterMemberRecord {
  bytes host_id = 1;
  int32 role = 2;
  bytes rpc_address = 3;
  uint32 rpc_port = 4;
  ClusterTime session_start = 5;
  ClusterTime last_heartbeat = 6;
  ClusterTime record_expiry = 7;
}
message ClusterCommand {
  enum Kind { UNSPECIFIED = 0; LIST = 1; GET = 2; SAVE = 3; DELETE = 4; GET_MEMBERS = 5; UPSERT_MEMBER = 6; PRUNE_MEMBERS = 7; }
  Kind kind = 1;
  string cluster_name = 2;
  ClusterBlob blob = 3;
  int64 version = 4;
  int64 page_size = 5;
  optional bytes next_page_token = 6;
  int64 last_heartbeat_within_nanos = 7;
  optional bytes rpc_address_equals = 8;
  optional bytes host_id_equals = 9;
  int32 role_equals = 10;
  ClusterTime session_started_after = 11;
  ClusterMemberRecord member = 12;
  int64 record_expiry_nanos = 13;
  int64 max_records_pruned = 14;
}
message ClusterResult {
  enum Error { NONE = 0; NOT_FOUND = 1; UNAVAILABLE = 2; INTERNAL = 3; INVALID_ARGUMENT = 4; RESOURCE_EXHAUSTED = 5; }
  Error error = 1;
  string message = 2;
  ClusterRecord record = 3;
  repeated ClusterRecord records = 4;
  bytes next_page_token = 5;
  bool applied = 6;
  repeated ClusterMemberRecord members = 7;
}
