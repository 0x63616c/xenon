syntax = "proto3";
package xenon.v1;
option go_package = "github.com/0x63616c/xenon/api/xenon/v1;xenonv1";

// Global namespace catalog and its notification counter occupy one control partition.
service MetadataPersistence { rpc Execute(MetadataRequest) returns (MetadataResult); }
message MetadataCommand {
  enum Kind { KIND_UNSPECIFIED = 0; CREATE = 1; GET = 2; UPDATE = 3; RENAME = 4; DELETE = 5; DELETE_BY_NAME = 6; LIST = 7; GET_METADATA = 8; }
  Kind kind = 1;
  bytes id = 2;
  string name = 3;
  string previous_name = 4;
  bytes data = 5;
  int32 encoding = 6;
  bool is_global = 7;
  int64 notification_version = 8;
  int32 page_size = 9;
  bytes next_page_token = 10;
}
message MetadataRequest {
  uint32 protocol_version = 1;
  string partition = 2;
  string operation_id = 3;
  bytes command_sha256 = 4;
  MetadataCommand command = 5;
}
message NamespaceRecord {
  bytes id = 1;
  string name = 2;
  bytes data = 3;
  int32 encoding = 4;
  bool is_global = 5;
  int64 notification_version = 6;
}
message MetadataResult {
  enum Error { NONE = 0; NOT_FOUND = 1; ALREADY_EXISTS = 2; CONDITION_FAILED = 3; UNAVAILABLE = 4; }
  Error error = 1;
  string message = 2;
  repeated NamespaceRecord namespaces = 3;
  int64 notification_version = 4;
  bytes next_page_token = 5;
}
