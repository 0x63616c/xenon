syntax="proto3";
package xenon.v1;
import "xenon/v1/history.proto";
option go_package="github.com/0x63616c/xenon/api/xenon/v1;xenonv1";
service ExecutionPersistence {rpc Execute(ExecutionRequest) returns(ExecutionResult);}
message ExecutionRequest {uint32 protocol_version=1;string partition=2;string operation_id=3;bytes command_sha256=4;ExecutionCommand command=5;}
message ExecutionChasmNode {HistoryBlob metadata=1;HistoryBlob data=2;HistoryBlob cassandra_blob=3;}
message ExecutionTask {int32 category_id=1;int32 category_type=2;int64 task_id=3;int64 fire_seconds=4;int32 fire_nanos=5;HistoryBlob blob=6;}
message ExecutionImage {
 string namespace_id=1;string workflow_id=2;string run_id=3;
 bytes execution_info_proto=4;bytes execution_state_proto=5;
 HistoryBlob execution_info_blob=6;HistoryBlob execution_state_blob=7;
 int64 next_event_id=8;int64 start_version=9;int64 last_write_version=10;int64 db_record_version=11;int64 condition=12;
 map<int64,HistoryBlob> activities=13;map<string,HistoryBlob> timers=14;map<int64,HistoryBlob> children=15;map<int64,HistoryBlob> cancels=16;map<int64,HistoryBlob> signals=17;map<string,ExecutionChasmNode> chasm=18;
 repeated string signal_requested_ids=19;repeated HistoryBlob buffered_events=20;HistoryBlob checksum=21;repeated ExecutionTask tasks=22;
}
message ExecutionMutation {
 ExecutionImage upsert=1;repeated int64 delete_activities=2;repeated string delete_timers=3;repeated int64 delete_children=4;repeated int64 delete_cancels=5;repeated int64 delete_signals=6;repeated string delete_chasm=7;repeated string delete_signal_requested_ids=8;bool clear_buffered_events=9;HistoryBlob new_buffered_events=10;
}
message ExecutionCommand {
 enum Kind{UNSPECIFIED=0;CREATE=1;UPDATE=2;CONFLICT_RESOLVE=3;SET=4;GET=5;GET_CURRENT=6;DELETE=7;DELETE_CURRENT=8;LIST=9;}
 Kind kind=1;int32 shard_id=2;int64 range_id=3;int32 mode=4;uint32 archetype_id=5;string previous_run_id=6;int64 previous_last_write_version=7;
 ExecutionImage snapshot=8;ExecutionMutation mutation=9;ExecutionImage new_snapshot=10;ExecutionMutation current_mutation=11;repeated HistoryCommand history_prewrites=12;
 string namespace_id=13;string workflow_id=14;string run_id=15;int64 page_size=16;bytes next_page_token=17;
}
message ExecutionCurrent {string run_id=1;bytes state_proto=2;HistoryBlob state_blob=3;int64 last_write_version=4;}
message ExecutionResult {
 enum Error{NONE=0;NOT_FOUND=1;UNAVAILABLE=2;INTERNAL=3;CONDITION_FAILED=4;WORKFLOW_CONDITION_FAILED=5;CURRENT_CONDITION_FAILED=6;OWNERSHIP_LOST=7;}
 Error error=1;string message=2;ExecutionImage image=3;ExecutionCurrent current=4;int64 actual_next_event_id=5;int64 actual_db_record_version=6;int32 shard_id=7;repeated ExecutionImage images=8;bytes next_page_token=9;
}
