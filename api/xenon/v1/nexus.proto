syntax = "proto3";
package xenon.v1;
option go_package = "github.com/0x63616c/xenon/api/xenon/v1;xenonv1";
service NexusPersistence { rpc Execute(NexusRequest) returns (NexusResult); }
message NexusEndpoint { bytes id = 1; int64 version = 2; bytes data = 3; int32 encoding = 4; }
message NexusCommand {
  enum Kind { UPSERT = 0; DELETE = 1; GET = 2; LIST = 3; }
  Kind kind = 1;
  int64 table_version = 2;
  NexusEndpoint endpoint = 3;
  bytes id = 4;
  int64 page_size = 5;
  bytes next_page_token = 6;
}
message NexusRequest { uint32 protocol_version = 1; string partition = 2; string operation_id = 3; bytes command_sha256 = 4; NexusCommand command = 5; }
message NexusResult {
  enum Error { NONE = 0; NOT_FOUND = 1; UNAVAILABLE = 2; CONDITION_FAILED = 3; INTERNAL = 4; RESOURCE_EXHAUSTED = 5; }
  Error error = 1;
  string message = 2;
  int64 table_version = 3;
  NexusEndpoint endpoint = 4;
  repeated NexusEndpoint endpoints = 5;
  bytes next_page_token = 6;
}
