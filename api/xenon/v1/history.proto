syntax="proto3";
package xenon.v1;
option go_package="github.com/0x63616c/xenon/api/xenon/v1;xenonv1";
service HistoryPersistence { rpc Execute(HistoryRequest) returns(HistoryResult); }
message HistoryRequest { uint32 protocol_version=1; string partition=2; string operation_id=3; bytes command_sha256=4; HistoryCommand command=5; }
message HistoryBlob { bytes data=1; int32 encoding=2; }
message HistoryNodeRecord { int64 node_id=1; int64 transaction_id=2; int64 previous_transaction_id=3; HistoryBlob events=4; }
message HistoryTreeRecord { int32 shard_id=1; bytes tree_id=2; bytes branch_id=3; HistoryBlob info=4; }
message HistoryDeleteRange { bytes branch_id=1; int64 begin_node_id=2; }
message HistoryCommand {
 enum Kind { UNSPECIFIED=0; APPEND=1; DELETE_NODE=2; READ=3; FORK=4; DELETE_BRANCH=5; LIST_TREES=6; GET_TREE=7; }
 Kind kind=1; int32 shard_id=2; bytes tree_id=3; bytes branch_id=4; bytes branch_info=5; bytes branch_token=6; HistoryNodeRecord node=7; HistoryBlob tree_info=8; bool is_new_branch=9; string info=10; bytes new_branch_token=11; int64 fork_node_id=12; repeated HistoryDeleteRange ranges=13; int64 min_node_id=14; int64 max_node_id=15; int64 page_size=16; bytes next_page_token=17; bool metadata_only=18; bool reverse_order=19;
}
message HistoryResult { enum Error { NONE=0; UNAVAILABLE=1; CONDITION_FAILED=2; INVALID_REQUEST=3; APPEND_TIMEOUT=4; INTERNAL=5; } Error error=1; string message=2; repeated HistoryNodeRecord nodes=3; repeated HistoryTreeRecord trees=4; bytes next_page_token=5; }
