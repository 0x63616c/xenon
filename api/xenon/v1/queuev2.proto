syntax = "proto3";
package xenon.v1;
option go_package = "github.com/0x63616c/xenon/api/xenon/v1;xenonv1";
service QueueV2Persistence { rpc Execute(QueueV2Request) returns (QueueV2Result); }
message QueueV2Request { uint32 protocol_version=1; string partition=2; string operation_id=3; bytes command_sha256=4; QueueV2Command command=5; }
message QueueV2Command { enum Kind { CREATE=0; ENQUEUE=1; READ=2; DELETE_RANGE=3; LIST=4; } Kind kind=1; int64 queue_type=2; string queue_name=3; bytes data=4; int32 encoding=5; bool has_blob=6; int64 page_size=7; bytes next_page_token=8; int64 inclusive_max_id=9; }
message QueueV2Entry { int64 id=1; bytes data=2; int32 encoding=3; }
message QueueV2Info { string name=1; int64 count=2; int64 last_id=3; }
message QueueV2State { string name=1; int64 min_id=2; int64 last_id=3; }
message QueueV2Result { enum Error { NONE=0; NOT_FOUND=1; ALREADY_EXISTS=2; INVALID_READ_TOKEN=3; INVALID_LIST_TOKEN=4; NONPOSITIVE_READ_SIZE=5; NONPOSITIVE_LIST_SIZE=6; NEGATIVE_OFFSET=7; INVALID_DELETE_ID=8; UNKNOWN_ENCODING=9; INVALID_ARGUMENT=10; } Error error=1; string message=2; int64 message_id=3; int64 deleted=4; repeated QueueV2Entry messages=5; repeated QueueV2Info queues=6; bytes next_page_token=7; }
