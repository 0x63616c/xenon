syntax = "proto3";
package xenon.v1;
option go_package = "github.com/0x63616c/xenon/gen/xenon/v1;xenonv1";
service QueuePersistence { rpc Execute(QueueRequest) returns(QueueResult); }
message QueueRequest { uint32 protocol_version=1; string partition=2; string operation_id=3; bytes command_sha256=4; QueueCommand command=5; }
message QueueCommand {
 enum Kind { UNSPECIFIED=0; INIT=1; ENQUEUE=2; READ=3; DELETE_BEFORE=4; UPDATE_ACK=5; GET_ACK=6; ENQUEUE_DLQ=7; READ_DLQ=8; DELETE_DLQ=9; RANGE_DELETE_DLQ=10; UPDATE_DLQ_ACK=11; GET_DLQ_ACK=12; }
 Kind kind=1; int32 queue_type=2; bytes data=3; int32 encoding=4; int64 version=5; int64 first_id=6; int64 last_id=7; int64 page_size=8; bytes next_page_token=9;
}
message QueueEntry { int32 queue_type=1; int64 id=2; bytes data=3; string encoding=4; }
message QueueMetadataRecord { bytes data=1; int32 encoding=2; int64 version=3; }
message QueueResult {
 enum Error { NONE=0; UNAVAILABLE=1; INTERNAL=2; }
 Error error=1; string message=2; int64 message_id=3; repeated QueueEntry messages=4; QueueMetadataRecord metadata=5; bytes next_page_token=6;
}
