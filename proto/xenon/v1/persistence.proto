syntax = "proto3";
package xenon.v1;
import "xenon/v1/metadata.proto";
import "xenon/v1/cluster.proto";
import "xenon/v1/queuev2.proto";
option go_package = "github.com/0x63616c/xenon/gen/xenon/v1;xenonv1";

// One request is a complete partition operation, never a remote transaction session.
service ShardPersistence { rpc Execute(ShardRequest) returns (ShardResult); }
message ShardCommand {
  enum Kind { KIND_UNSPECIFIED = 0; GET = 1; CREATE_OR_GET = 2; UPDATE = 3; ASSERT = 4; }
  Kind kind = 1;
  int32 shard_id = 2;
  int64 previous_range_id = 3;
  int64 range_id = 4;
  bytes data = 5;
  int32 encoding = 6;
  string owner = 7;
}
message ShardRequest {
  uint32 protocol_version = 1;
  string partition = 2;
  string operation_id = 3;
  bytes command_sha256 = 4;
  ShardCommand command = 5;
}
message ShardResult {
  enum Error { NONE = 0; NOT_FOUND = 1; OWNERSHIP_LOST = 2; UNAVAILABLE = 3; }
  Error error = 1;
  string message = 2;
  int32 shard_id = 3;
  bytes data = 4;
  int32 encoding = 5;
  int64 range_id = 6;
}
message StoredShard { int64 range_id = 1; bytes data = 2; int32 encoding = 3; }
message StoredOutcome { bytes command_sha256 = 1; oneof result { ShardResult shard_result = 2; MetadataResult metadata_result = 3; ClusterResult cluster_result = 4; QueueV2Result queuev2_result = 10; } }
